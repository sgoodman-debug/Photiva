name: IndexNow Ping

# Tells Bing (and the other IndexNow engines, which ChatGPT search draws on)
# that photiva.app changed. Runs when Vercel reports a successful Production
# deployment, so the new pages are live before Bing is told to fetch them.
# URLs come from the live sitemap, so new pages are included automatically.
#
# The IndexNow key is public by design: it is served at
# https://photiva.app/<key>.txt so search engines can verify ownership.
on:
  deployment_status:
  workflow_dispatch:

env:
  HOST: photiva.app
  INDEXNOW_KEY: bbf8fa345e55865ab699c54767969b3d

jobs:
  ping:
    name: Submit URLs to IndexNow
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest

    steps:
      - name: Build URL list from the live sitemap
        run: |
          urls=$(curl -fsS "https://$HOST/sitemap.xml" | grep -oE '<loc>[^<]+' | sed 's/<loc>//')
          urls="$urls"$'\n'"https://$HOST/llms.txt"
          echo "$urls"
          jq -n --arg host "$HOST" --arg key "$INDEXNOW_KEY" --arg urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: ($urls | split("\n") | map(select(length > 0)))}' \
            > payload.json

      - name: Check the key file is live
        run: test "$(curl -fsS "https://$HOST/$INDEXNOW_KEY.txt")" = "$INDEXNOW_KEY"

      - name: Ping IndexNow (Bing)
        run: |
          status=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @payload.json)
          echo "IndexNow HTTP status: $status"
          cat response.txt || true
          # 200 = accepted, 202 = accepted pending key validation
          case "$status" in 200|202) ;; *) exit 1 ;; esac
